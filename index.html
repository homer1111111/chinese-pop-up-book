<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta name="app-version" content="2026-09-26s">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>《中文》第五册 立体绘本</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --wall:#2F5D62;
  --wood:#C98E5A;
  --walnut:#5E3B2A;
  --paper:#FBF3E2;
  --paper-2:#F3E6CB;
  --ink:#3A2E28;
  --ink-soft:#7A6656;
  --seal:#C8453B;
  --gold:#E8B84A;
  --leaf:#6E9E5B;
  --kai:"LXGW WenKai","Kaiti SC","STKaiti","KaiTi","Noto Serif CJK SC","Noto Serif SC",serif;
  --ui:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d3438;color:var(--ink);font-family:var(--kai)}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#trail{position:fixed;inset:0;pointer-events:none;z-index:5}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.hidden{display:none!important}

/* ---------- top bar ---------- */
#top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:calc(10px + var(--sat)) 14px 10px;pointer-events:none}
#top > *{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 15px;border-radius:21px;
  background:rgba(251,243,226,.94);box-shadow:0 2px 0 rgba(94,59,42,.35);font-size:17px;color:var(--ink);white-space:nowrap}
.pill:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(94,59,42,.35)}
.pill svg{width:20px;height:20px;flex:none}
#bookTitle{font-size:19px;color:var(--paper);text-shadow:0 1px 3px rgba(0,0,0,.5);padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;pointer-events:none}
#top .spacer{flex:1}
#musicBtn{width:42px;padding:0;justify-content:center}
#tools{display:flex;gap:8px}
body.locked .lockable{opacity:.45;pointer-events:none}

/* ---------- story card ---------- */
#story{position:fixed;left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);z-index:20;
  width:min(760px,calc(100% - 20px));background:var(--paper);border-radius:18px;
  box-shadow:0 3px 0 #d9c49c,0 10px 30px rgba(0,0,0,.28);padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px}
#story .row{display:flex;align-items:center;gap:10px}
#actDots{display:flex;gap:6px;flex:none}
#actDots i{width:10px;height:10px;border-radius:50%;background:#dccaa6}
#actDots i.on{background:var(--seal)}
#actDots i.done{background:#b89a6a}
#narr{--fs:clamp(17px,2.4vw,21px);font-size:var(--fs);line-height:1.6;flex:1;min-width:0}
/* the line being spoken, repeated in the story card (bubbles are small on phones) */
#lineBox{flex:1;min-width:0;display:flex;align-items:flex-end;gap:8px;padding:6px 10px 8px;background:#FFF3DF;border-radius:12px;border-left:4px solid #E8894A}
#lineBox .who{margin:0 0 4px;flex:none}
#lineText{--fs:clamp(16px,2.2vw,19px);font-size:var(--fs);line-height:1.5;flex:1;min-width:0}
#lineText .c[data-i]{cursor:pointer}
#story .ctrl2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg.sm button{height:30px;padding:0 11px;font-size:15px}
.spd{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 5px 0 12px;border-radius:18px;background:var(--paper-2);font-size:15px;color:var(--ink)}
.spd button{width:28px;height:28px;border-radius:50%;background:#fff;font-size:18px;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.spdIn{width:60px;height:28px;border:1px solid #d9c49c;border-radius:8px;text-align:center;font-family:var(--ui);font-size:15px;background:#fff;color:var(--ink);padding:0 2px}
.c.hl{background:#FFE9A8;border-radius:6px}
.bub.tag .c.hl{background:rgba(255,255,255,.35)}
#narr .c[data-i]{cursor:pointer}
#story .ctrl{display:flex;align-items:center;gap:8px;justify-content:space-between}
#hint{font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
#hint b{color:var(--seal);font-weight:700}
#hint{flex-wrap:wrap;flex:1 1 0;min-width:0}
.hintBtn{max-width:100%;overflow:hidden;text-overflow:ellipsis}
#story .ctrl{flex-wrap:wrap;row-gap:8px}
#prevBtn{width:44px;padding:0;justify-content:center;font-size:26px;line-height:1}
#prevBtn[disabled]{opacity:.35;cursor:default}
/* dialogue script in the reader */
.pghead{margin:18px 0 8px;font-size:17px;color:#fff;background:var(--leaf);display:inline-block;padding:3px 14px;border-radius:14px;font-weight:700}
.pghead:first-child{margin-top:0}
.who{display:inline-block;vertical-align:bottom;margin:0 8px 6px 0;padding:2px 10px;border-radius:10px;background:var(--paper-2);
  font-size:15px;color:var(--ink-soft);font-family:var(--kai)}
.who.narr{background:transparent;border:1px dashed #cdb58a}
.who.list{background:#E8894A;color:#fff}
.hintBtn{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 14px;border-radius:18px;background:#FFF1D6;
  box-shadow:0 2px 0 #e3c48e;font-size:16px;color:var(--ink)}
.hintBtn:active{transform:translateY(1px);box-shadow:0 1px 0 #e3c48e}
.btn{height:44px;padding:0 18px;border-radius:22px;font-size:18px;background:var(--paper-2);color:var(--ink);
  box-shadow:0 2px 0 #cfb88c;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.main{background:var(--seal);color:#fff;box-shadow:0 2px 0 #8e2c25}
.btn.main[disabled]{background:#d8c7a8;box-shadow:0 2px 0 #bfa981;color:#fff;cursor:default}
.btn:active:not([disabled]){transform:translateY(1px)}
.docTabs button[data-d="chars"]{color:#4c7640;font-weight:700}
.docTabs button.on[data-d="chars"]{background:var(--leaf);color:#fff}
.charsLink{display:block;margin:18px auto 0;height:46px;padding:0 22px;border-radius:23px;background:var(--leaf);color:#fff;font-size:18px;box-shadow:0 2px 0 #4c7640}
.sideBtns{display:flex;flex-direction:column;gap:8px;flex:none}
/* labelled buttons so they are easy to find: 旁白 (listen) and 对话跟读 (dialogue script) */
.sideBtns{gap:6px}
.sideBtns .icon-btn{width:60px;height:auto;border-radius:12px;padding:4px 2px 3px;flex-direction:column;gap:1px}
.sideBtns .icon-btn span{font-size:12px;font-family:var(--ui);line-height:1.1;white-space:nowrap}
.sideBtns .icon-btn svg{width:18px;height:18px}
#charsBtn{background:var(--leaf);color:#fff;box-shadow:0 2px 0 #4c7640}
#scriptBtn{background:#E8894A;color:#fff;box-shadow:0 2px 0 #b8622c}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--paper-2);box-shadow:0 2px 0 #cfb88c;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:22px;height:22px}
/* keep on one line */
.auto{white-space:nowrap;font-size:14px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px;font-family:var(--ui)}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
#nextBtn.ready{animation:nudge 1.1s ease-in-out infinite}

/* ---------- shelf bar ---------- */
#shelfBar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 12px calc(12px + var(--sab));
  background:linear-gradient(transparent,rgba(20,34,36,.85) 35%)}
#shelfBar .head{display:flex;align-items:baseline;gap:12px;color:var(--paper);padding:0 6px 8px}
#shelfBar .head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.05em}
#shelfBar .head span{font-size:15px;opacity:.85}
#chips{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 4px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0 14px;border-radius:12px;background:rgba(251,243,226,.95);font-size:17px;display:flex;align-items:center;gap:7px}
.chip em{font-style:normal;font-size:13px;color:#fff;background:var(--c,#999);border-radius:6px;padding:1px 6px;font-family:var(--ui)}
.chip .seal{width:20px;height:20px;border-radius:50%;background:var(--seal);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
#tip{position:fixed;z-index:16;pointer-events:none;background:var(--paper);border-radius:10px;padding:6px 12px;font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.3);transform:translate(-50%,-130%);white-space:nowrap}

/* ---------- speech bubbles ---------- */
.bub{width:max-content;--fs:clamp(15px,2vw,18px);position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#fff;border-radius:16px;padding:8px 14px;
  font-size:var(--fs);line-height:1.45;max-width:min(300px,70vw);box-shadow:0 3px 10px rgba(0,0,0,.2);white-space:normal;text-align:center}
.bub:after{content:"";position:absolute;left:calc(50% + var(--tx, 0px));bottom:-9px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top:10px solid #fff}
.bub.think{background:#f3f7fb}
.bub.think:after{border-top-color:#f3f7fb}
.bub.tag{--fs:15px;background:var(--seal);color:#fff;font-size:15px;padding:4px 10px;border-radius:8px}
.bub.tag .c .rt{color:rgba(255,255,255,.85)}
.bub .bt{display:inline}
.bub.fairy{background:#EEEDFE;border:1.5px solid #7F77DD;color:#3C3489}
.bub.fairy:after{border-top-color:#EEEDFE}
.bub.fairy .c .rt{color:#534AB7}
.ftag{display:inline-block;font-size:11px;background:#534AB7;color:#fff;border-radius:6px;padding:0 6px;margin-right:4px;vertical-align:middle;font-family:var(--ui);pointer-events:none}
.who.fairyWho{background:#534AB7;color:#fff}
.bub .bt .c[data-i]{pointer-events:auto;cursor:pointer}
.bub .spk{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin-left:6px;vertical-align:bottom;
  border-radius:50%;background:var(--paper-2);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.bub .spk svg{width:16px;height:16px}
.bub.tag .spk{background:rgba(255,255,255,.25);color:#fff;width:24px;height:24px}
.bub.tag:after{border-top-color:var(--seal)}

/* ---------- overlays ---------- */
.veil{position:fixed;inset:0;z-index:40;background:rgba(24,34,36,.55);display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--sat)) 12px calc(12px + var(--sab))}
.sheet{background:var(--paper);border-radius:20px;width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.4);overflow:hidden}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid #eadbbd}
.sheet header h3{margin:0;font-size:22px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-bottom:1px solid #eadbbd;align-items:center}
.sheet .body{overflow:auto;padding:16px 18px 28px;-webkit-overflow-scrolling:touch}
.seg{display:inline-flex;border-radius:22px;background:var(--paper-2);padding:3px}
.seg button{height:36px;padding:0 12px;border-radius:18px;font-size:16px;color:var(--ink-soft)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.rate{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-family:var(--ui);color:var(--ink-soft)}
.rate input{width:110px;accent-color:var(--seal)}
.rate .spdIn{width:60px}
.spdIn::-webkit-inner-spin-button,.spdIn::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.spdIn{-moz-appearance:textfield;appearance:textfield}

/* reader */
#readBody{--fs:26px;padding-bottom:80px}
.para{margin:0 0 18px}
.sent{display:inline;border-radius:10px;cursor:pointer;padding:2px 0;transition:background .2s}
.sent.now{background:#FFE9A8}
.sent.ttl{display:block;text-align:center;font-weight:700;margin:4px 0}
.sent.author{display:block;text-align:center;color:var(--ink-soft);margin-bottom:8px}
.poem .sent{display:block;text-align:center}
.c{display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom;margin:0 .02em}
.c .rt{display:block;font-family:var(--ui);font-size:calc(var(--fs)*.46);line-height:1.1;color:#8a5a3b;height:1.15em;white-space:nowrap}
.c b{font-weight:400;font-size:var(--fs);line-height:1.25}
.nopy .c .rt{display:none}
.cw{display:inline-flex;align-items:flex-end;white-space:nowrap}
.zy .c .rt{font-size:calc(var(--fs)*.42)}
/* new characters of the lesson: red, and always annotated (even when notation is off) */
.c.nw b{color:var(--seal)}
.c.nw .rt{color:var(--seal);font-weight:700}
.nopy .c.nw .rt{display:block}
.legend{font-family:var(--ui);font-size:14px;color:var(--ink-soft);padding:8px 16px 0}
.legend b{color:var(--seal);font-family:var(--kai);font-size:17px;font-weight:700}
.yourturn{display:inline-flex;align-items:center;gap:6px;margin-left:8px;vertical-align:middle;background:var(--leaf);color:#fff;border-radius:14px;padding:3px 12px;font-size:16px;font-family:var(--kai)}
.yourturn i{display:block;width:60px;height:6px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.yourturn i:after{content:"";display:block;height:100%;width:var(--p,0%);background:#fff}
#readVeil .sheet{position:relative}
.yourturn.float{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;margin:0;font-size:19px;padding:7px 18px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.voiceWarn{font-family:var(--ui);font-size:14px;color:#9a3b2f;background:#fbe5dd;border-radius:10px;padding:8px 12px;margin:0 16px 0}

/* cards */
#cardDetail{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:4px 0 16px;border-bottom:1px dashed #d9c49c;margin-bottom:14px}
.tian{width:132px;height:132px;position:relative;border:2px solid var(--seal);background:#fff;display:flex;align-items:center;justify-content:center;font-size:96px;line-height:1}
.tian:before,.tian:after{content:"";position:absolute;inset:0;pointer-events:none}
.tian:before{background:linear-gradient(to right,transparent calc(50% - .5px),rgba(200,69,59,.35) calc(50% - .5px),rgba(200,69,59,.35) calc(50% + .5px),transparent calc(50% + .5px)),
  linear-gradient(to bottom,transparent calc(50% - .5px),rgba(200,69,59,.35) calc(50% - .5px),rgba(200,69,59,.35) calc(50% + .5px),transparent calc(50% + .5px))}
.tian.word{width:auto;min-width:132px;padding:0 14px;font-size:60px}
.tian.word:before{display:none}
.dInfo .py{font-size:28px;font-family:var(--ui);color:#8a5a3b}
.dInfo .zy{font-size:24px;color:var(--ink-soft);margin-left:10px}
.dInfo .en{font-size:16px;font-family:var(--ui);color:var(--ink-soft);margin:4px 0 8px}
.dInfo .ws{display:flex;flex-wrap:wrap;gap:6px}
.dInfo .ws span{background:var(--paper-2);border-radius:8px;padding:2px 10px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.grid.words{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:#fff;border-radius:14px;padding:10px 6px 8px;text-align:center;box-shadow:0 2px 0 #e6d4b0;border:2px solid transparent}
.card.on{border-color:var(--seal)}
.card .h{font-size:40px;line-height:1.1}
.grid.words .card .h{font-size:30px}
.card .p{font-size:14px;font-family:var(--ui);color:#8a5a3b}
.card .z{font-size:14px;color:var(--ink-soft)}
/* flip cards */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.fgrid.words{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.fcard{position:relative;perspective:700px;aspect-ratio:1/1.1;cursor:pointer}
.fgrid.words .fcard{aspect-ratio:1.4/1}
.fcard .inner{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.fcard.on .inner{transform:rotateY(180deg)}
.fcard .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;text-align:center;padding:8px 6px;background:#fff;border-radius:14px;box-shadow:0 2px 0 #e6d4b0;border:2px solid transparent}
.fcard .face.back{transform:rotateY(180deg);border-color:var(--seal);background:#FFFBF2}
.fcard .hz{font-size:44px;line-height:1.1}
.fgrid.words .fcard .hz{font-size:30px}
.fcard .py{font-family:var(--ui);font-size:18px;color:#8a5a3b;word-break:break-word;line-height:1.3}
.fcard .py.zy{font-family:var(--kai);font-size:20px}
.fcard .face:not(.back) .py{font-size:22px}
.fcard .en{font-family:var(--ui);font-size:12px;color:var(--ink-soft);line-height:1.3}
.fcard .say{position:absolute;right:6px;bottom:6px;z-index:3;width:30px;height:30px;border-radius:50%;background:var(--paper-2);
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.fcard .say svg{width:16px;height:16px}
.fcard.on .say{opacity:1;pointer-events:auto}
/* one card at a time */
.fone{display:flex;flex-direction:column;align-items:center}
.fone-card{width:min(300px,80%);touch-action:pan-y}
.fone-card .fcard{aspect-ratio:1/1.1}
.fone.words .fone-card .fcard{aspect-ratio:1.3/1}
.fone .fcard .hz{font-size:130px}
.fone.words .fcard .hz{font-size:64px}
.fone .fcard .py{font-size:30px}
.fone .fcard .face:not(.back) .py{font-size:40px}
.fone .fcard .en{font-size:16px}
.fone .fcard .say{width:42px;height:42px;right:10px;bottom:10px}
.fone .fcard .say svg{width:22px;height:22px}
.fnav{display:flex;align-items:center;gap:14px;margin-top:16px}
.fpos{font-family:var(--ui);font-size:17px;color:var(--ink-soft);min-width:4.5em;text-align:center}
.fhint{text-align:center;font-family:var(--ui);font-size:13px;color:var(--ink-soft);margin-top:12px}
@media (prefers-reduced-motion:reduce){ .fcard .inner{transition:none} }

/* quiz */
#quizBox{width:min(620px,100%);background:var(--paper);border-radius:22px;padding:22px 20px 20px;box-shadow:0 18px 50px rgba(0,0,0,.4);text-align:center}
#quizBox .qn{font-size:15px;color:var(--ink-soft);font-family:var(--ui)}
#quizBox .qt{font-size:clamp(21px,3vw,26px);line-height:1.5;margin:8px 0 16px;display:flex;gap:10px;align-items:center;justify-content:center}
#quizOpts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:54px;border-radius:14px;background:#fff;font-size:21px;padding:8px 16px;box-shadow:0 2px 0 #e0cda7;text-align:left}
.opt.py{font-family:var(--ui);text-align:center;font-size:24px}
.opt.big{text-align:center;font-size:34px;line-height:1.2}
.opt.right{background:#DDEFD2;box-shadow:0 2px 0 #9cc486}
.opt.wrong{background:#eee3d6;color:#a99a88}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.opt.shake{animation:shake .35s}
#quizMsg{height:26px;margin-top:10px;font-size:18px;color:var(--seal)}

/* ending */
#endBox{width:min(460px,100%);background:var(--paper);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.bigSeal{width:150px;height:150px;border-radius:50%;margin:4px auto 12px;background:var(--seal);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:84px;box-shadow:inset 0 0 0 6px var(--seal),inset 0 0 0 9px #f6d9d2,0 6px 0 #8e2c25}
#endBox h3{margin:0 0 4px;font-size:26px}
#startBox{width:min(420px,100%);background:var(--paper);border-radius:22px;padding:22px 20px 20px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.4)}
#startBox h3{margin:0 0 4px;font-size:26px}
#startBox p{margin:0 0 16px;font-size:18px;color:var(--ink-soft)}
#startBox .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#startBox .btn{height:50px;font-size:19px}
#endBox p{margin:0 0 16px;font-size:18px;color:var(--ink-soft)}
#endBox .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* intro */
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:max(9vh,60px) !important;gap:18px;
  background:radial-gradient(ellipse at 50% 42%,rgba(24,44,54,.32),rgba(24,44,54,.72));color:var(--paper);text-align:center;padding:20px;text-shadow:0 2px 10px rgba(0,0,0,.45)}   /* the school gate shows through */
#intro .vol{font-size:clamp(18px,3vw,24px);letter-spacing:.3em;opacity:.85}
#intro h1{margin:0;font-size:clamp(46px,9vw,92px);font-weight:700;letter-spacing:.08em;line-height:1.1}
#intro h1 small{display:block;font-size:.34em;letter-spacing:.2em;font-weight:400;margin-top:12px;opacity:.9}
#intro .btn.main{height:56px;font-size:22px;padding:0 30px;border-radius:28px}
.vrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px}
#intro .vbtn{height:56px;font-size:21px;padding:0 20px;border-radius:28px}
.vbtn small{font-size:12px;margin-left:4px;font-family:var(--ui);opacity:.8}
.vbtn[disabled]{opacity:.45;cursor:default}
#shelfBar .head{flex-wrap:wrap;row-gap:4px}
#shelfBar .head h2{white-space:nowrap}
.volBtn{white-space:nowrap;background:rgba(251,243,226,.9);color:var(--ink);border-radius:16px;padding:3px 12px;font-size:15px;font-family:var(--ui)}
#volBox{width:min(460px,100%);background:var(--paper);border-radius:22px;padding:22px 20px 20px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.4)}
#volBox h3{margin:0 0 14px;font-size:24px}
#volBox .vrow .btn{height:50px;font-size:19px}
#intro .note{font-size:14px;opacity:.7;font-family:var(--ui)}
#campusBar{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--paper);border-radius:22px;padding:10px 22px;font-size:20px;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap}
#fader{position:fixed;inset:0;z-index:60;background:#FFF8EC;opacity:0;pointer-events:none;display:none}
#fader.on{display:block}
#toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:14px;z-index:40;background:rgba(58,46,40,.88);color:#fff;border-radius:14px;padding:6px 14px;font-size:15px;font-family:var(--ui);pointer-events:none}
#readVeil,#cardVeil,#gameVeil{z-index:46}
/* ---------- games ---------- */
.docTabs button[data-d="games"]{color:#3D6FA8;font-weight:700}
.docTabs button.on[data-d="games"]{background:#5B8DB8;color:#fff}
.ghead{font-size:16px;color:var(--ink-soft);font-family:var(--ui);margin:16px 2px 8px}
.ghead:first-child{margin-top:0}
.gpick.g3d{background:linear-gradient(135deg,#fff,#EAF3FB)}
.g3wrap{position:relative;border-radius:16px;overflow:hidden;background:#9ED3E8;max-width:720px;margin:0 auto}
.g3wrap canvas{display:block;width:100%;touch-action:none;cursor:pointer}
.g3hud{position:absolute;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.g3hud > *{pointer-events:auto}
.g3pill{white-space:nowrap;background:rgba(251,243,226,.94);border-radius:16px;padding:4px 12px;font-size:16px;font-family:var(--ui);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.g3target{display:flex;align-items:center;gap:8px;background:rgba(251,243,226,.96);border-radius:18px;padding:4px 6px 4px 14px;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.g3target .py{font-family:var(--ui);color:#8a5a3b;font-size:22px}
.g3target .icon-btn{width:36px;height:36px}
.g3msg{position:absolute;left:0;right:0;bottom:10px;text-align:center;pointer-events:none}
.g3msg span{background:rgba(58,46,40,.75);color:#fff;border-radius:14px;padding:4px 14px;font-size:17px}
.g3msg span:empty{display:none}
.g3ctl{display:flex;justify-content:center;gap:16px;margin-top:10px}
.g3ctl .btn{width:88px;justify-content:center;font-size:26px;user-select:none;-webkit-user-select:none}
.wsent{--fs:30px;line-height:1.3;text-align:center;margin:10px 0 16px}
.wsent .c[data-i]{cursor:pointer;border-radius:8px}
.wsent .c.bad b{color:var(--seal);background:#f9dcd6;border-radius:6px}
.wsent .c.fixed b{color:#3f7a33;background:#DDEFD2;border-radius:6px}
.wopts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.wopts .opt{min-width:80px}
.mean{text-align:center;font-family:var(--ui);font-size:26px;margin:14px 0 18px;color:var(--ink)}
.gmenu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.gpick{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 0 #e6d4b0}
.gpick .ic{font-size:34px;flex:none}
.gpick .t{font-size:21px;font-weight:700}
.gpick .d{font-size:14px;color:var(--ink-soft);font-family:var(--ui);margin-top:2px}
.gstat{display:flex;justify-content:space-between;gap:10px;font-family:var(--ui);font-size:15px;color:var(--ink-soft);margin-bottom:12px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:0 auto}
.mcard{aspect-ratio:1/1.1;border-radius:12px;background:var(--leaf);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #4c7640;transition:transform .2s,background .2s}
.mcard .mb{display:none}
.mcard.open,.mcard.done{background:#fff;color:var(--ink);box-shadow:0 3px 0 #e6d4b0}
.mcard.open .mf,.mcard.done .mf{display:none}
.mcard.open .mb,.mcard.done .mb{display:block}
.mcard.done{background:#DDEFD2;transform:scale(.94)}
.mb.hz{font-size:36px}
.mb.py{font-family:var(--ui);font-size:17px;color:#8a5a3b}
.mb.py.zy{font-family:var(--kai);font-size:19px}
.tq{text-align:center}
.tq .tbig{font-size:110px;line-height:1.1}
.tq .tpy{font-family:var(--ui);font-size:30px;color:#8a5a3b;min-height:40px}
.tq .say{margin:6px auto 14px}
.tbtns{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:420px;margin:0 auto}
.tbtn{height:64px;border-radius:14px;background:#fff;box-shadow:0 2px 0 #e0cda7;font-size:21px}
.tbtn b{font-family:var(--ui);font-size:26px;margin-right:6px}
.tbtn.right,.mhalf.right{background:#DDEFD2;box-shadow:0 2px 0 #9cc486}
.tbtn.wrong,.mhalf.wrong{background:#f3d9d3}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;margin:0 auto}
.mcol{display:flex;flex-direction:column;gap:10px}
.mhalf{min-height:62px;border-radius:12px;background:#fff;box-shadow:0 2px 0 #e0cda7;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.mhalf .h{font-size:26px;line-height:1.2}
.mhalf .p{font-family:var(--ui);font-size:13px;color:#8a5a3b}
.mhalf.sel{outline:3px solid var(--gold);outline-offset:1px}
.mhalf.done{background:#DDEFD2;opacity:.75;box-shadow:none}
.oans{min-height:84px;border:2px dashed #d9c49c;border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:#fffdf6}
.oans.right{border-color:var(--leaf);background:#EEF6E8}
.oans:empty:before{content:"点下面的词语，排成一句话";color:#bda57c;font-size:16px;align-self:center}
.opool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:60px}
.chunk{--fs:24px;background:#fff;border-radius:12px;padding:4px 10px 6px;box-shadow:0 2px 0 #e0cda7}
.chunk .c{margin:0}
.orow{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.gmsg{text-align:center;height:26px;margin-top:10px;font-size:18px;color:var(--seal)}
.gwin{text-align:center;padding:24px 10px}
.gwin .big{font-size:60px}
.gwin h4{font-size:26px;margin:6px 0}
.gwin p{font-family:var(--ui);color:var(--ink-soft);margin:0 0 16px}
@keyframes gshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gshake{animation:gshake .35s}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
#toast{position:fixed;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);z-index:45;background:var(--ink);color:var(--paper);border-radius:12px;padding:8px 16px;font-size:16px;opacity:0;pointer-events:none;transition:opacity .3s}
#loadErr{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:18px;line-height:1.7}

@media (max-width:640px){
  /* phone: mode switch and speed share one row; hint and auto-voice don't break mid-word */
  #story .ctrl2{gap:6px}
  .seg.sm button{padding:0 8px;font-size:14px}
  .spd{padding-left:8px;gap:3px;font-size:14px}
  .spd button{width:26px;height:26px}
  .spdIn{width:48px}
  .hintBtn{font-size:14px;padding:0 10px}
  #narr{--fs:16px}
  #lineText{--fs:15px}
  .auto .lbl2,.hintBtn .lbl2{display:none}
  #story .ctrl{gap:6px}
  #prevBtn{width:38px}
  #nextBtn{padding:0 12px}
  .fgrid{grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
  .fgrid.words{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .fcard .hz{font-size:36px}
  .fcard .py{font-size:15px}
  .fcard .face:not(.back) .py{font-size:18px}
  .pill{height:38px;padding:0 11px;font-size:15px}
  #bookTitle{font-size:16px}
  .pill .lbl{display:none}
  #story{padding:10px 12px}
  .btn{height:42px;padding:0 14px;font-size:17px}
  .tian{width:104px;height:104px;font-size:74px}
  #readBody{--fs:22px}
}
@media (prefers-reduced-motion:reduce){ #nextBtn.ready{animation:none} }
</style>
</head>
<body>
<canvas id="stage" aria-label="3D 立体绘本"></canvas>
<canvas id="trail"></canvas>
<div id="bubbles"></div>
<div id="flash"></div>
<div id="toast" role="status"></div>
<div id="tip" class="hidden"></div>

<div id="top">
  <button class="pill lockable hidden" id="homeBtn" title="回书架">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a1 1 0 0 1 1-1h3v16H5a1 1 0 0 1-1-1z"/><path d="M8 4h4v16H8"/><path d="M14.5 5.2l3.4-.9 3.1 11.6-3.4.9z"/></svg><span class="lbl">书架</span></button>
  <div id="bookTitle"></div>
  <div class="spacer"></div>
  <div id="tools" class="hidden">
    <button class="pill lockable" id="readBtn" title="课文跟读">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg><span class="lbl">课文跟读</span></button>
    <button class="pill lockable" id="cardsBtn" title="生字卡">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18M3 12h18" stroke-dasharray="2 2"/></svg><span class="lbl">生字卡</span></button>
    <button class="pill lockable" id="orbitBtn" title="转转看">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg><span class="lbl">转转看</span></button>
  </div>
  <button class="pill" id="musicBtn" title="音乐开关" aria-pressed="true"></button>
</div>

<div id="story" class="hidden">
  <div class="row">
    <div id="actDots"></div>
    <div id="narr"></div>
    <div id="lineBox" class="hidden"><span class="who" id="lineWho"></span><div class="lt" id="lineText"></div></div>
    <div class="sideBtns">
      <button class="icon-btn lockable" id="sayBtn" title="听旁白">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg><span>旁白</span></button>
      <button class="icon-btn lockable" id="scriptBtn" title="对话跟读" aria-label="对话跟读">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.4A8 8 0 1 1 21 12z"/><path d="M8.5 10.5h7M8.5 14h4.5"/></svg><span>对话跟读</span></button>
      <button class="icon-btn lockable" id="charsBtn" title="生字" aria-label="生字">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18M3 12h18" stroke-dasharray="2 2"/></svg><span>生字</span></button>
    </div>
  </div>
  <div class="ctrl2">
    <div class="seg sm modeSeg"><button data-m="full">整句</button><button data-m="seg">分段</button><button data-m="char">逐字</button></div>
    <div class="spd">语速 <button class="spdDn" type="button" title="慢一点">−</button><input class="spdIn" type="number" min="0.2" max="2" step="0.05" inputmode="decimal" aria-label="语速"><button class="spdUp" type="button" title="快一点">＋</button></div>
  </div>
  <div class="ctrl">
    <div id="hint"></div>
    <div style="display:flex;align-items:center;gap:10px">
      <label class="auto"><input type="checkbox" id="autoSay">自动<span class="lbl2">旁白</span></label>
      <button class="btn lockable" id="prevBtn" title="上一页" aria-label="上一页" disabled>‹</button>
      <button class="btn main lockable" id="nextBtn" disabled>下一页</button>
    </div>
  </div>
</div>

<div id="shelfBar" class="hidden">
  <div class="head"><h2 id="volName">第五册</h2><button class="volBtn" id="volBtn">回校园</button><span id="badgeCount"></span></div>
  <div id="chips"></div>
</div>

<div class="veil hidden" id="readVeil">
  <div class="sheet" role="dialog" aria-label="课文跟读">
    <header><h3 id="readTitle"></h3><button class="icon-btn" id="readClose" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="bar">
      <div class="seg docTabs" id="docSeg"><button data-d="text">课文</button><button data-d="script">对话</button><button data-d="chars">生字</button><button data-d="games">游戏</button></div>
      <button class="btn main" id="playAll">▶ 朗读全文</button>
      <button class="btn" id="followBtn">跟着念</button>
      <button class="btn" id="stopBtn">■ 停止</button>
      <div class="seg modeSeg"><button data-m="full">整句</button><button data-m="seg">分段</button><button data-m="char">逐字</button></div>
      <div class="seg" id="notSeg"><button data-v="pinyin" class="on">拼音</button><button data-v="zhuyin">注音</button><button data-v="off">不标</button></div>
      <label class="rate">语速 <input type="range" id="rate" min="0.2" max="1.5" step="0.05"><input class="spdIn" type="number" min="0.2" max="2" step="0.05" inputmode="decimal" aria-label="语速">×</label>
      <div class="seg"><button id="fsDown">A−</button><button id="fsUp">A＋</button></div>
    </div>
    <div class="legend" id="readLegend"><b>红色</b>的字是本课生字，都会标上拼音。</div>
    <div class="voiceWarn hidden" id="voiceWarn"></div>
    <div class="body" id="readBody"></div>
  </div>
</div>

<div class="veil hidden" id="cardVeil">
  <div class="sheet" role="dialog" aria-label="生字卡">
    <header><h3 id="cardTitle"></h3><button class="icon-btn" id="cardClose" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="bar"><div class="seg docTabs" id="cardDocSeg"><button data-d="text">课文</button><button data-d="script">对话</button><button data-d="chars" class="on">生字</button><button data-d="games">游戏</button></div>
      <div class="seg" id="cardSeg"></div>
      <div class="seg" id="cardView"><button data-v="list">卡片</button><button data-v="flip">翻卡</button></div>
      <div class="seg hidden" id="flipLayout"><button data-v="grid">全部</button><button data-v="one">一张一张</button></div>
      <div class="seg hidden" id="flipFront"><button data-v="hz">正面：汉字</button><button data-v="py">正面：拼音</button></div>
      <button class="btn hidden" id="flipReset">全部盖回</button></div>
    <div class="body"><div id="cardDetail"></div><div id="cardGrid" class="grid"></div></div>
  </div>
</div>

<div class="veil hidden" id="gameVeil">
  <div class="sheet" role="dialog" aria-label="游戏">
    <header><h3 id="gameTitle"></h3><button class="icon-btn" id="gameClose" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="bar"><div class="seg docTabs" id="gameDocSeg"><button data-d="text">课文</button><button data-d="script">对话</button><button data-d="chars">生字</button><button data-d="games" class="on">游戏</button></div>
      <button class="btn hidden" id="gameBack">‹ 游戏列表</button></div>
    <div class="body" id="gameBody"></div>
  </div>
</div>

<div class="veil hidden" id="quizVeil">
  <div id="quizBox" role="dialog" aria-label="小测验">
    <div class="qn" id="quizNum"></div>
    <div class="qt"><span id="quizQ"></span><button class="icon-btn" id="quizSay" title="听题目"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button></div>
    <div id="quizOpts"></div>
    <div id="quizMsg"></div>
  </div>
</div>

<div class="veil hidden" id="volVeil">
  <div id="volBox" role="dialog" aria-label="选一册"><h3>换一册</h3><div class="vrow" id="volBtns"></div></div>
</div>

<div class="veil hidden" id="startVeil">
  <div id="startBox" role="dialog" aria-label="开始">
    <h3 id="startTitle"></h3>
    <p>想先做什么？</p>
    <div class="acts">
      <button class="btn main" id="goStory">▶ 看立体故事</button>
      <button class="btn" id="goText">📖 课文</button>
      <button class="btn" id="goChars">📝 生字</button>
      <button class="btn" id="goGames">🎮 游戏</button>
      <button class="btn" id="goShelf">📚 回书架</button>
    </div>
  </div>
</div>

<div class="veil hidden" id="endVeil">
  <div id="endBox" role="dialog" aria-label="获得徽章">
    <div class="bigSeal" id="endSeal"></div>
    <h3 id="endName"></h3>
    <p id="endText"></p>
    <div class="acts">
      <button class="btn" id="endRead">课文跟读</button>
      <button class="btn" id="endCards">生字卡</button>
      <button class="btn" id="endAgain">再读一次</button>
      <button class="btn main" id="endHome">回书架</button>

{"n":3,"t":"快乐的“中华文化大乐园”","en":"Happy \"Chinese Culture Park\"","text":"大家好！我是校园小记者云云，新一期的“中华文化大乐园”又开始了。听说这期课程非常丰富，有中国民族舞蹈、书法、中国功夫，还有剪纸、皮影、捏泥人等等。我们一起去看看吧。\n首先看到的是舞蹈班，老师正带着大家练习中国传统民族舞蹈《赛马》呢。音乐响起，同学们好像变成了勇敢的小骑手，骑着马儿在草原上奔跑。这边静悄悄的，哦，原来是书法班在上课。大家正在学习用毛笔写字。瞧，他们一笔一画写得多认真啊！现在看到的是手工艺术班，同学们正跟着老师捏泥人。来看看已经完成的作品，色彩鲜艳，造型可爱，同学们真是心灵手巧！\n看来同学们在“中华文化大乐园”学到的东西可真不少！由于时间关系，本期节目就到这里。下次再会！","py":"dà|jiā|hǎo||wǒ|shì|xiào|yuán|xiǎo|jì|zhě|yún|yún||xīn|yī|qī|de||zhōng|huá|wén|huà|dà|lè|yuán||yòu|kāi|shǐ|le||tīng|shuō|zhè|qī|kè|chéng|fēi|cháng|fēng|fù||yǒu|zhōng|guó|mín|zú|wǔ|dǎo||shū|fǎ||zhōng|guó|gōng|fū||hái|yǒu|jiǎn|zhǐ||pí|yǐng||niē|ní|rén|děng|děng||wǒ|men|yī|qǐ|qù|kàn|kàn|ba|||shǒu|xiān|kàn|dào|de|shì|wǔ|dǎo|bān||lǎo|shī|zhèng|dài|zhe|dà|jiā|liàn|xí|zhōng|guó|chuán|tǒng|mín|zú|wǔ|dǎo||sài|mǎ||ne||yīn|yuè|xiǎng|qǐ||tóng|xué|men|hǎo|xiàng|biàn|chéng|le|yǒng|gǎn|de|xiǎo|qí|shǒu||qí|zhe|mǎ|ér|zài|cǎo|yuán|shàng|bēn|pǎo||zhè|biān|jìng|qiāo|qiāo|de||ò||yuán|lái|shì|shū|fǎ|bān|zài|shàng|kè||dà|jiā|zhèng|zài|xué|xí|yòng|máo|bǐ|xiě|zì||qiáo||tā|men|yī|bǐ|yī|huà|xiě|de|duō|rèn|zhēn|a||xiàn|zài|kàn|dào|de|shì|shǒu|gōng|yì|shù|bān||tóng|xué|men|zhèng|gēn|zhe|lǎo|shī|niē|ní|rén||lái|kàn|kàn|yǐ|jīng|wán|chéng|de|zuò|pǐn||sè|cǎi|xiān|yàn||zào|xíng|kě|ài||tóng|xué|men|zhēn|shì|xīn|líng|shǒu|qiǎo|||kàn|lái|tóng|xué|men|zài||zhōng|huá|wén|huà|dà|lè|yuán||xué|dào|de|dōng|xī|kě|zhēn|bù|shǎo||yóu|yú|shí|jiān|guān|xì||běn|qī|jié|mù|jiù|dào|zhè|lǐ||xià|cì|zài|huì|","chars":[["者","zhě","one who; person","ㄓㄜˇ"],["始","shǐ","to begin","ㄕˇ"],["民","mín","people","ㄇㄧㄣˊ"],["族","zú","ethnic group; clan","ㄗㄨˊ"],["舞","wǔ","to dance","ㄨˇ"],["功","gōng","skill; merit","ㄍㄨㄥ"],["影","yǐng","shadow; image","ㄧㄥˇ"],["捏","niē","to knead; to pinch","ㄋㄧㄝ"],["统","tǒng","to unify; system","ㄊㄨㄥˇ"],["响","xiǎng","to sound; loud","ㄒㄧㄤˇ"],["勇","yǒng","brave","ㄩㄥˇ"],["敢","gǎn","to dare; bold","ㄍㄢˇ"],["骑","qí","to ride","ㄑㄧˊ"],["艺","yì","art; skill","ㄧˋ"],["彩","cǎi","colour","ㄘㄞˇ"],["巧","qiǎo","skilful; clever","ㄑㄧㄠˇ"]],"words":[["文化","wén const SCRIPTS5 = {"1":[["周末，我和爸爸妈妈一起去超市。出发前，我们先列了一份购物清单。",[]],["超市人很多，为了节约时间，我们分头行动。爸爸去生活用品区，挑选洗衣液、洗发水、牙膏等等。",[]],["我和妈妈先去买学习用品，然后去服装区，再去食品区选购食物。\\n服装区有很多衣服在打折。“妈妈，这条裙子真漂亮，打三折呢！”妈妈觉得裙子还不错，不过颜色有点儿深，让我再想想。",[]],["在食品区我们花了很长时间，因为有很多新鲜的食品，我还试吃了几种。",[]],["该买的东西都买了，在购物清单之外，我还买了一个新书包。对了，那条裙子呢？我早把它忘了。看来，它没那么漂亮。",[]]],"2":[["周末，爸爸妈妈带我们一起去海边露营。",[]],["大约开了两个小时的车，我们到了海边，沙滩上已经搭满了大大小小的帐篷。蓝蓝的天空，白白的沙滩，五颜六色的帐篷，好像一幅美丽的油画。",[]],["帐篷搭好了，换上泳衣，爸爸带着我们去海里游泳。",[]],["晚上，全家人坐在帐篷边，一边聊天一边烧烤，这样的夜晚真是太美妙了！",[]],["夜深了，躺在帐篷里，听着远处的海浪声，我很快就进入了甜美的梦乡。",[]]],"3":[["大家好！我是校园小记者云云，新一期的“中华文化大乐园”又开始了。听说这期课程非常丰富，有中国民族舞蹈、书法、中国功夫，还有剪纸、皮影、捏泥人等等。我们一起去看看吧。",[]],["首先看到的是舞蹈班，老师正带着大家练习中国传统民族舞蹈《赛马》呢。音乐响起，同学们好像变成了勇敢的小骑手，骑着马儿在草原上奔跑。",[]],["这边静悄悄的，哦，原来是书法班在上课。大家正在学习用毛笔写字。瞧，他们一笔一画写得多认真啊！",[]],["现在看到的是手工艺术班，同学们正跟着老师捏泥人。来看看已经完成的作品，色彩鲜艳，造型可爱，同学们真是心灵手巧！",[]],["看来同学们在“中华文化大乐园”学到的东西可真不少！由于时间关系，本期节目就到这里。下次再会！",[]]],"4":[["一天，狼来到一条小河边，看见小羊正在那儿喝水。",[]],["狼非常想吃掉小羊。可是他想，当着面，总得找个借口才行。于是，狼就对着小羊大喊起来：“你怎么到这儿来喝水？把我喝的水弄脏了，害得我不能喝。你安的什么心？”",[]],["小羊大吃一惊，轻轻地说：“亲爱的狼先生，我怎么会把您喝的水弄脏呢？您站在上游，我站在下游。水是从您那儿流到我这儿的，不是从我这儿流到您那儿的。”",[]],["“就算是这样吧，”狼说，“你也是个坏东西。听说去年你说过我的坏话。”\\n“啊，亲爱的狼先生，那是没有的事，去年我还没出生呢。”",[]],["“别说了！”狼走近小羊，大声叫道：“你这个小坏蛋！说我坏话的不是你，就是你爸爸，反正都一样。”一说完，狼就向小羊扑了过去。",[]]],"5":[["一天，火热的太阳照在大地上，天气热极了。狐狸走了很远的路，满头大汗，又饿又渴。他一边走一边自言自语地说：“如果有吃的、喝的，那该多好啊！”",[]],["狐狸走着走着，来到一个葡萄园，看见一串串又大又圆的葡萄高高地挂在葡萄架上。他高兴极了：“哈哈！今天的运气真不错！我从来没见过这么大、这么好的葡萄，它一定很甜，很好吃。”",[]],["于是，他看准一串又大又好的葡萄，用力向上跳，伸出手去摘。可是，他怎么也够不着那串葡萄。他跳了一次又一次，始终摘不到葡萄。最后，他累得一点儿力气都没有了，只好垂头丧气地走开了。",[]],["狐狸一边走一边自言自语地说：“这种葡萄有什么好！全是酸的，我才不喜欢吃呢。”\\n狐狸吃不到葡萄，就说葡萄是酸的。",[]]],"6":[["闻鸡起舞\\n祖逖小的时候就有远大的理想，可他却很淘气，不爱读书。长大以后，他慢慢认识到，不读书就没有知识，没有知识就很难实现自己的理想。于是，他就和好朋友刘琨一起互相鼓励，开始发奋读书。",[]],["每天清晨，他们一听到鸡叫，就起床舞剑，读书写字，春夏秋冬，从不间断。经过长期的努力，祖逖终于成了一个能文能武的人，他既能写一手好文章，又能带兵打仗，最终实现了他报效国家的理想。",[]],["画龙点睛\\n南北朝时，有个画家叫张僧繇。相传，他在金陵安乐寺的墙壁上画了四条龙。这四条龙张牙舞爪，栩栩如生，但是都没有眼睛。大家看了觉得奇怪，就请张僧繇把龙的眼睛补上去。张僧繇拒绝了，说：“画上眼睛，龙就会飞走的。”大家不信，认为他是在吓唬人。",[]],["后来，在大家的一再要求下，张僧繇只好提起笔来，轻轻一点。霎时间，乌云密布，电闪雷鸣，只见被点上眼睛的那条龙腾空而起，驾着云雾飞上天去了。大家都惊呆了，仔细再看，墙上真的只剩下三条没有点睛的龙了。",[]]],"7":[["在中国历史上，唐代很繁荣，那时中国很强盛，所以海外华侨和华人常常把自己叫做“唐人”，“唐人”集中生活的地方就叫“唐人街”。",[]],["在世界上，很多城市都有唐人街。美国旧金山的唐人街就很有名。最早生活在旧金山唐人街的是当年开发美国西海岸的华工。他们和美国人民一起，为美国的独立和繁荣立下了很大的功劳。",[]],["当时，他们有的人在唐人街开中国餐馆、商店，有的人还做别的买卖。后来，他们办起了中文学校，成立了同乡会。这样，唐人街上的华人越来越多，那儿的街道也越来越繁华。在唐人街上，到处都有汉字，到处都有人讲汉语。",[]],["一到春节，各地唐人街的华侨和华人，都要贴对联、挂灯笼、舞狮子、吃饺子，一起热热闹闹地迎接新的一年。",[]]],"8":[["2003年10月15日上午9时，中国第一艘载人航天飞船“神舟五号”在中国酒泉卫星发射中心升空。10分钟后，船箭分离，“发射成功了！”顿时，发射中心大厅欢声雷动。",[]],["“神舟五号”的宇航员只有一人，他就是中国飞天第一人——杨利伟。和他一起遨游太空的还有另外一些“游客”：一面中国国旗、一面北京2008年奥运会会旗、一面联合国旗，还有来自中国宝岛——台湾的农作物种子。",[]],["这些物品和飞天英雄杨利伟在太空遨游了20多个小时，于16日6时23分顺利回到地面。",[]],["“神舟五号”载人航天飞船的成功飞行，使中国人千年的飞天梦想变为现实！更可喜的是，不到两年时间，“神舟六号”载着两名宇航员于2005年10月12日成功升空。“神舟六号”开展了多种科学实验，在太空遨游了五天后顺利回到地面。",[]],["2012年6月16日，“神舟九号”成功发射，三十三岁的刘洋成为中国首位遨游太空的女性。“神十”“神十一”“神十二”……，深远的太空充满奥秘，中国航天的步伐也永不停歇。",[]]],"9":[["游子吟\\n［唐］孟郊\\n慈母手中线，游子身上衣。临行密密缝，意恐迟迟归。",[]],["谁言寸草心，报得三春晖。",[]],["回乡偶书\\n［唐］贺知章\\n少小离家老大回，乡音无改鬓毛衰。儿童相见不相识，笑问客从何处来。",[]]],"10":[["一千多年前，中国有个大官，叫曹操。一天，有人从南方用船运来一头大象。曹操知道了，就带着儿子曹冲和官员们一起去河边看大象。",[]],["这头象又高又大，身子像一面墙，腿像四根柱子。大家边看边说：“这么大的象能有多重呢？”曹操问：“谁有办法把这头大象称一称？”有人说：“上哪儿去找这么大的秤呢？”有人说：“就是有这么大的秤，也没有人抬得动它。”还有人说：“要是能把大象分成一块一块的该多好，这样就能称了。”曹操听了直摇头。",[]],["这时，七岁的曹冲站出来说：“我有个好主意。”大人们非常惊奇地问：“你有什么好主意？”曹冲不慌不忙地说：“把大象赶到一条木船上，然后在船边沿着水面画一条线；再把大象赶上岸，往船上装石头；等船下沉到刚才画线的地方，称一称船上的石头，就知道大象有多重了。”",[]],["曹操和官员们听了直点头，大家都称赞曹冲是个聪明的孩子。",[]]],"11":[["1984年的一天，巴黎卢浮宫出现了一位古怪的老人。这个老人穿着灰色西装，戴着棕色的圆框眼镜，两鬓斑白，目光炯炯有神。",[]],["他一整天都没有参观任何展品，而是一直在拿破仑中庭里走来走去，不时用手中的相机拍下一些细节，然后又在笔记本上写着什么。",[]],["由于这个人已经是第三次出现，而且每一次的行为都十分可疑，展馆内的安保人员赶紧向馆长报告。",[]],["作为整座卢浮宫里唯一知道事情真相的人，馆长听了一点儿也不好奇，相反，他的眼里还露出一丝不屑：“哼，我就不信，一个外国老头能设计出什么好作品？”",[]],["馆长口中的“外国老头”叫贝聿铭，是一位美籍华裔建筑大师。他受邀成为历史上第一个参与卢浮宫扩建设计的外籍建筑师。\\n面对不少人的怀疑和反对，他以一组精巧独特的玻璃金字塔设计赢得了世界的认可。",[]],["其实，这位老人的作品远远不止这一个。波士顿肯尼迪图书馆、华盛顿国家美术馆、北京香山饭店、苏州博物馆等，都是他的杰作。贝聿铭的作品很好地融合了东西方元素，既古典又现代。",[]]],"12":[["李时珍是中国明代著名的医学家和药物学家。他的父亲是个医生，给穷人看病常常不收钱。李时珍从小就决心当医生，给穷人看病。",[]],["因为那时人们看不起当医生的，所以父亲不同意。但是，李时珍的决心一直没有改变。他处处留心学习，在父亲给人看病时暗暗地记下了许多药方。",[]],["有一次，父亲给人看完病，一时想不出合适的药方，心里很着急。这时，李时珍在旁边轻轻地说出了一个药方。父亲听了很高兴，就给病人开了这个药方。病人吃了药，很快就好了，还亲自上门感谢。从此以后，父亲就同意李时珍学医了。",[]],["李时珍二十二岁开始给人看病。他发现医书上有很多错误，很多药都没有记上去。于是，他就到各地名山去采药，还亲自检验药性。经过二十七年的刻苦努力，他写成了著名的《本草纲目》。这部书有一百多万字，记下了一千八百多种药物。这部伟大的药物学著作，被译成了多国文字，在世界上广为流传。",[]]]};

const SENTS3 = {"1":[[9,[2,2,2,2]],[27,[2,2,4]],[37,[2,2,4]],[55,[2,2,4]],[64,[2,2,4]]],"2":[[0,[2,4,2,6]],[47,[5,4,4,5]],[65,[4,2,4]],[136,[2,4,8,5,3,3]]],"3":[[0,[5,3,2,3,3,2,3]],[22,[5,2,4,3,2,7]],[80,[4,3,4,5]],[96,[2,4,4,4,3]],[113,[4,3,4]]],"4":[[9,[2,2,4]],[18,[2,2,4]],[55,[4,2,2]],[64,[2,2,4]]],"5":[[10,[6,5,4,3,5,2,6]],[41,[4,5,4,2,5,2,6]],[69,[5,4,3,2,4,2,6]],[130,[2,2,4,2]]],"6":[[0,[2,6,3,2,4]],[68,[2,5,8]]],"7":[[10,[2,4,2,2,2]],[22,[2,4,2,4]],[48,[2,2,2,2,4]]],"8":[[0,[2,5,4,4]],[16,[5,3,3,3]],[30,[3,5,3,5]],[94,[2,2,4]],[102,[3,3,8]],[116,[3,3,4,5]],[131,[3,2,3,2,3,2]],[146,[2,2,5,3]],[158,[3,4,4,4,3,4]]],"9":[[0,[4,2,2,2,6,2,5]],[98,[2,5,3,5]],[122,[3,3,2,4,3]]],"10":[[0,[2,3,5]],[21,[2,4,5]],[32,[2,2,3,2,2]],[99,[2,3,2,7]]],"11":[[0,[3,4,3,3]],[13,[4,2,2,4,2,6]],[70,[3,3,2,2,3,4]],[140,[2,4,3,4,4]],[157,[5,2,4,2,3,8]]],"12":[[0,[3,2,2,3,3]],[52,[3,3,4,2,3,2]],[194,[3,2,2,3,2,2,5]]]}, SCRIPTS3 = {"1":[["街道宽，街道长，\\n街道交通真是忙。\\n好在有了红绿灯，\\n人来车往很通畅。",[]],["弟弟妹妹手拉手，\\n一起走到街道口。\\n看见红灯停一停，\\n看见绿灯往前走。",[]]],"2":[["今天星期天，爸爸和我去书店。\\n书店里的儿童书可真多，有童话故事、儿童画报，还有很多中文课本。",[]],["我拿了一本安徒生的童话故事看了起来。一会儿，爸爸来叫我。他说：“现在十二点了。妈妈在家等我们吃饭呢。”",[]],["我说：“爸爸，我很喜欢安徒生的童话故事，给我买一本吧。”爸爸说：“好。”\\n爸爸付了钱，我拿着新买的书，高高兴兴地走出了书店。",[]]],"3":[["我感冒了，发烧，爸爸和妈妈带我去医院看病。",[]],["到了医院，护士给我量了体温，医生给我做了检查。",[]],["医生对爸爸妈妈说：“她感冒了，在发烧呢。打一针，吃一点儿药就会好的。”听了医生的话，爸爸妈妈都放心了。",[]],["爸爸付了钱，拿了药，就带我去打针。打了针，我觉得好多了。",[]]],"4":[["丁零零，丁零零，\\n没有鼻子没眼睛。\\n一只耳朵一张嘴，\\n一边说话一边听。",[]],["嗡嗡嗡，嗡嗡嗡，\\n飞来飞去忙做工。\\n传花粉，采花蜜，\\n从小个个爱劳动。",[]]],"5":[["你们知道我是谁吗？\\n太阳一出来，我就变成了“汽”，在天上飘来飘去，人们叫我“云”。",[]],["在天上，冷风一来，我就变成小雨珠掉下来，人们叫我“雨”。到了冬天，我又变成一朵朵小花飘下来，人们叫我“雪”。",[]],["我有时候爱在湖里睡觉，有时候爱在河里欢跑，有时候爱在大海里又唱又跳。人们一天都少不了我。大家知道我是谁吗？",[]]],"6":[["冬天到了，下起了大雪，满地白白的。\\n小猫打开门，一看就叫了起来：“下糖了！下糖了！”",[]],["小狗听见了，马上打开门，说：“不对，是下盐了！”\\n他们争了起来，都说自己是对的。",[["小猫","是糖！"],["小狗","是盐！"]]],["这时，小兔走过来说：“你们别争了，是糖还是盐，大家尝一尝就知道了。”",[]],["小猫和小狗尝了一点儿雪，说：“它不甜，也不咸，吃在嘴里凉凉的。”小兔告诉他们：“这不是糖，也不是盐，它叫‘雪’。”",[]]],"7":[["静夜思\\n［唐］李白\\n床前明月光，疑是地上霜。举头望明月，低头思故乡。",[]],["登鹳雀楼\\n［唐］王之涣\\n白日依山尽，黄河入海流。欲穷千里目，更上一层楼。",[]]],"8":[["瓦特是两百多年前英国的科学家。",[]],["他小时候，有一天看奶奶做饭。一壶水开了，壶盖不停地上下跳动。瓦特觉得很奇怪，就问：“奶奶，壶盖为什么会动？”奶奶说：“水开了，水蒸气冲出来，壶盖就动了。”",[]],["瓦特还是不明白。为什么水开了就会有水蒸气呢？为什么水蒸气能让壶盖动起来呢？他常常坐在炉边，一边看一边想。",[]],["长大后，他做了很多试验。后来，他发明了蒸汽机，成了一位有名的科学家。",[]]],"9":[["古代没有纸，人们常常把字写在竹片上，很不方便。",[]],["公元一〇五年，中国有个叫蔡伦的人，决心造出一种又好又方便的东西，给人们写字。",[]],["他做了很多试验，把树皮、草和破布泡在水里，打成纸浆，再把纸浆铺在竹帘上。纸浆干了以后，拿下来就成了纸。",[]],["纸是蔡伦发明的。造纸术是中国古代四大发明之一。",[]]],"10":[["兔子和乌龟要赛跑了。小鸟一叫：“一二三！”兔子就飞快地跑了出去。乌龟一步一步地向前爬。",[]],["兔子跑了一会儿，回头看不见乌龟，他很得意，就想：“乌龟爬得真慢，我睡一觉，等他追上来我再跑，我仍然可以得第一。”这样一想，兔子就睡起觉来了。",[]],["乌龟在后面不停地向前爬，从兔子身边爬了过去，一直爬到了终点，得了第一名，可兔子还在那儿睡大觉呢！",[]]],"11":[["猫妈妈带着小猫在河边钓鱼。一会儿，一只蜻蜓飞过来，小猫就去捉蜻蜓。",[]],["一会儿，一只蝴蝶飞过来，小猫又去捉蝴蝶，结果什么都没有捉到，也没有钓到鱼。",[]],["这时，猫妈妈已经钓到好几条大鱼了。小猫生气地说：“我怎么钓不到鱼呢？”妈妈说：“你一会儿捉蜻蜓，一会儿捉蝴蝶，三心二意，怎么能钓到鱼呢？”",[]],["小猫听了妈妈的话，就专心地钓鱼了。不一会儿，小猫也钓到了一条大鱼，她和妈妈都笑了。",[]]],"12":[["从前，有个孩子在山上放羊。他看到很多人在山下干活儿，想捉弄一下别人，就故意大声喊叫：“狼来了！狼来了！”",[]],["山下的人听到喊叫声，立刻跑上山来。可是，山上根本没有狼，是放羊的孩子在撒谎，人们被他欺骗了。",[]],["过了几天，人们又听见这个孩子在山上喊：“狼来了！狼来了！”大家又跑到山上去，结果还是没有狼，人们又被撒谎的孩子欺骗了。",[]],["又过了几天，狼真的来了。这个孩子又喊：“狼来了！狼来了！狼真的来了！”",[]],["山下的人们听见喊声，再也没有人理他了。结果，他的许多羊都被狼吃了。",[]]]};
const SENTS4 = {"1":[[11,[3,4,5]],[23,[4,2,4,3]],[70,[4,4,3,4,4,2,5]],[96,[3,4,5,4,6]],[119,[3,3,4,2,3,4,3]],[141,[2,3,5,2,3,3]],[160,[5,2,2]],[176,[5,3,1]]],"2":[[30,[4,4,6,3,3,3,3]],[56,[5,2,4,4,2,5]],[78,[4,4,2,2,4]],[94,[3,3,3,2,3]],[108,[3,2,3,3]],[159,[2,5,3,6]],[175,[4,2,4,4]],[189,[2,5,2,3]],[202,[4,2,5]]],"3":[[0,[5,3,2,4,3,6,3]],[26,[3,2,2,3,3,6]],[45,[3,4,3,2,7]],[65,[4,4,3,4]],[80,[2,2,3,4,3]],[94,[4,2,3,5]],[108,[3,3,3]],[151,[2,2,3,3,2,3]],[166,[5,2,4,5,5,5,2]],[194,[5,2,3,5,2,3]]],"4":[[0,[2,2,4]],[18,[2,2,4]],[27,[2,3,3]],[36,[2,3,3]],[45,[2,3,3]],[54,[2,2,4]],[63,[2,2,4]],[72,[2,4,2]]],"5":[[0,[2,4,2,2,2,4]],[108,[5,3,2,3,5,4,4]],[191,[2,4,3,6,2,3,2]]],"6":[[0,[3,3,2,2,4,2,3]],[118,[3,3,5,4,3,4,3]],[143,[6,3,2,5]],[159,[4,2,2,2,5]],[174,[3,2,4]]],"7":[[10,[2,2,2,2,4]],[22,[2,2,2,2,4]]],"8":[[0,[2,2,3,3,3,5]],[19,[3,6,4,3,6,5]],[46,[3,2,2,4,3]],[90,[2,5,2,3,2]],[104,[2,3,5,3,4]],[121,[2,3,4]],[130,[3,5,3,4,4,5,3]],[157,[2,6,3,2,3,4]]],"9":[[0,[3,3,2,3,3,3]],[17,[4,4,4,3,4,3,3]],[42,[3,2,3]],[50,[5,2,4]],[151,[2,4,2,4,5,3,4]],[175,[6,2,3,3,5]]],"10":[[0,[2,2,4]],[9,[2,2,4]],[18,[2,2,4]],[27,[2,2,4]],[37,[2,2,4]],[46,[2,2,4]],[55,[2,2,4]],[64,[2,2,4]],[74,[2,2,2,2]],[83,[2,2,4]],[92,[2,2,2,2]],[101,[2,2,4]],[111,[2,2,2,2]],[120,[2,2,4]],[129,[2,2,2,2]],[138,[2,2,4]]],"11":[[0,[2,3,3,6]],[14,[7,2,5]],[150,[2,5,2,3,3,4,4]],[173,[3,2,4,4,5]]],"12":[[8,[2,2,4,4,3]],[63,[2,4,2,7,3,3,3]],[87,[2,5,4,2,2,3]],[151,[2,3,2,3,3]],[164,[5,4,2,3,2,3,3]]]}, SCRIPTS4 = {"1":[["亲爱的爷爷：\\n您好！\\n今天，我收到了您的来信。我很喜欢信封上的长城邮票。",[]],["我知道，北京是中国的首都，那里有长城、故宫、颐和园，还有天安门广场。",[]],["爸爸说，今年夏天放假，我们全家要去北京看望您和奶奶。那时，我就可以去爬长城、游故宫、上天安门了。",[]],["亲爱的爷爷，我的中文水平是不是有了很大提高？今后我还要好好学习，争取更大的进步！\\n祝爷爷奶奶身体好！\\n孙儿　亮亮\\n二○○五年八月八日",[]]],"2":[["在中国北京城的西北，有一个美丽的大公园，它的名字叫颐和园。",[]],["进了公园东大门，有一条长长的走廊，这就是有名的长廊。",[]],["走完长廊，登上万寿山，颐和园的景色都能看到。从万寿山走下来，前面就是昆明湖。昆明湖长长的湖岸边一片绿色。湖中心有个美丽的小岛。",[]],["沿着湖边向东走，来到湖的东岸，从湖的东岸到湖中心的小岛，要走过一座长长的石桥。这座桥有十七个桥洞，叫十七孔桥。桥两边的石柱上有很多小狮子。它们都很生动，十分可爱。",[]],["颐和园的景色可真美啊！",[]]],"3":[["在法国巴黎以南的小城凡尔赛，有一座又大又美丽的园林。在园林中有一座有名的建筑，叫凡尔赛宫。它以前是法国的王宫，现在是国家博物馆。",[]],["凡尔赛宫有七百多间大厅和房间。这些大厅和房间里有很多文物。",[]],["最有趣的还是镜廊，又叫镜厅。镜厅里有很多名画。打开窗子，窗外的园林景色映入镜中，人在厅中，就如同身在画中一样啊！",[]],["王宫里面很美，宫外的园林更美。园中有一条十字人工河，还有明净的湖，绿色的树，美丽的花。鸟语花香，湖光树影，风景如画，十分迷人。",[]]],"4":[["太阳出来照四方，\\n它的好处不寻常。\\n太阳不晒草不绿，\\n太阳不晒苗不长。\\n太阳不晒果不熟，\\n太阳不晒花不香。",[]],["衣服被子晒一晒，\\n晒过太阳暖洋洋。\\n大家也要太阳晒，\\n常晒太阳才健康。",[]]],"5":[["小马要过河，看见一头老牛在喝水。\\n小马问：“牛伯伯，我要过河，水深吗？”\\n老牛说：“水很浅，你过得去。”",[]],["小马听了老牛的话，正要过河，突然，一只小松鼠从树上跳下来，大声说：“小马，别过河！水深得很呢！你会淹死的！”",[]],["听了小松鼠的话，小马不知道该怎么办，只好回家问妈妈。",[]],["妈妈说：“孩子，老牛又高又大，他会觉得水很浅；松鼠那么小，他一定会说水很深。河水是深还是浅，最好你自己去试试。”",[]],["小马听了妈妈的话，又跑到河边，小心地过了河。原来，河水既不像老牛说的那样浅，也不像松鼠说的那样深。",[]]],"6":[["有一天晚上，一群猴子在井边的树上玩儿。突然，一只小猴子喊起来：“不好啦，月亮掉到水里了！”大猴子一看，也叫了起来：“不好啦，月亮真的掉到水里了！”",[]],["一群猴子看了后都跟着说：“是啊，月亮怎么掉到水里了？”",[]],["大猴子说：“我们把月亮捞上来吧！”于是，猴子们爬到树上，一只拉着一只，一直接到水里。",[]],["挂在最下面的小猴子伸手去捞月亮。他的手刚碰到水，月亮就不见了。猴子们觉得很奇怪。这时，大猴子抬头一看，突然叫了起来：“月亮不是还在天上吗？”",[]]],"7":[["春晓\\n［唐］孟浩然\\n春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。",[]],["悯农\\n［唐］李绅\\n锄禾日当午，汗滴禾下土。谁知盘中餐，粒粒皆辛苦。",[]]],"8":[["中国古代有一个聪明的孩子，叫司马光。",[]],["一天，他和小朋友们在花园里玩儿，有的做游戏，有的爬树。突然，大家听到“扑通”一声。原来，树下有一个大水缸，有个小朋友不小心从树上掉到水缸里了。水缸又大又深，里面装满了水。",[]],["别的小朋友都吓哭了，不知道怎么办。只有司马光不惊慌。他很快想出了一个办法，找来一块大石头，使劲向水缸砸去。水缸破了，水流了出来，那个小朋友得救了。",[]],["大家都说：“司马光真聪明。”",[]]],"9":[["夏天的夜晚，天空布满了明亮的星星。一个孩子坐在院子里，靠着奶奶，仰着头数天上的星星。他一颗一颗地数。数了很久，还是数不完。",[]],["奶奶笑着说：“那么多星星，你能数得清吗？”孩子说：“看得见就能数得清。”",[]],["爷爷过来了，说：“孩子，你看，那七颗星连起来像一把勺子的，是北斗星。离它不远的那颗很亮的星，叫北极星。”",[]],["这个数星星的孩子叫张衡，是一千九百年前的中国人。他努力学习，长大后成了著名的天文学家。",[]]],"10":[["什么弯弯挂天边？\\n什么弯弯停江边？\\n月亮弯弯挂天边，\\n船儿弯弯停江边。",[]],["什么红红水中游？\\n什么红红照满天？\\n鲤鱼红红水中游，\\n太阳红红照满天。",[]],["什么尖尖手中握？\\n什么尖尖冲上天？\\n毛笔尖尖手中握，\\n火箭尖尖冲上天。",[]],["什么圆圆树上挂？\\n什么圆圆一串串？\\n苹果圆圆树上挂，\\n葡萄圆圆一串串。",[]]],"11":[["人有语言，大自然也有语言吗？有的，大自然的语言可丰富了。\\n你看，白云飘在高高的蓝天上，明天一定是个晴天，你可以去公园游玩了。",[]],["你看，地上的蚂蚁正在忙着搬家呢，天很快就要下雨了，你出门可要带上雨伞啊。",[]],["你再看，河里的冰化了，地上的草绿了，树叶长出来了，这是春天来了。\\n大自然的语言多么丰富，多么奇妙啊！只有认真学习，细心观察，你才能看得见，听得懂。让我们做个爱学习、爱思考的好学生吧。",[]]],"12":[["月亮上有什么呢？人们很早很早以前就想看个明白。一九六九年七月二十日，美国的两名宇航员第一次登上了月球，实现了人类登月的梦想。",[]],["七月十六日，他们坐着“阿波罗”号飞船离开了地球。",[]],["飞船飞得很快，飞了三天多才到达月球。",[]],["宇航员打开门，看见月球上到处都是阳光，到处都是石头和泥土，看不见一只飞鸟，听不到一点儿声音。月球是一个非常安静的世界。",[]],["他们在月球上工作了两个多小时后，飞离了月球。七月二十四日，他们带着月球上的泥土和石块，安全地回到了地球。",[]]]};

/* Fit the 3D picture into the part of the screen the story card does NOT cover.

const VIEW = { hf: 0, d: 0, k: 1 };
function aspectK() {
  const W = innerWidth, H = innerHeight, a = W / H;
  if (!VIEW.hf) return Math.max(1, Math.min(2.6, 1.55 / a));          // shelf etc.: original framing
  const kV = H / VIEW.hf * .8, kH = 1.55 / a * .95;                     // fit height of free area, and width

}
function layoutView(reapply) {
  const H = innerHeight, st = $('story');
  let hf = 0, d = 0;
  if (!st.classList.contains('hidden')) {
    const top = $('top').getBoundingClientRect().bottom, r = st.getBoundingClientRect();
    const bottom = Math.max(top + H * .3, r.top - 6);
    hf = bottom - top;
    d = Math.round(H / 2 - (top + bottom) / 2);                          // shift picture up to the free area's centre
  }
  const changed = Math.abs(hf - VIEW.hf) > 8 || Math.abs(d - VIEW.d) > 4;
  VIEW.hf = hf; VIEW.d = d;
  if (d) camera.setViewOffset(innerWidth, H, 0, d, innerWidth, H); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  if ((changed || reapply) && camPreset && !orbitOn) {
    const p = applyPreset(camPreset);
    if (gsap.isTweening(camBase) || gsap.isTweening(lookBase)) { if (!reapply) setTimeout(() => layoutView(true), 350); return; }
    gsap.to(camBase, { x: p.pos.x, y: p.pos.y, z: p.pos.z, duration: reapply === 'snap' ? 0 : .5, ease: 'power2.out' });

function monthBars(A, from, to) {
  const names = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
  const big = [1, 0, 1, 0, 1, 0, 1, 1, 0, 1, 0, 1], bars = [];
  const g = new THREE.Group();
  for (let i = from; i < to; i++) {
    const k = i - from, col = big[i] ? '#C8453B' : '#5B8DB8';
    const bar = box(.8, 1, .8, col, 0, .5, 0); bar.scale.y = .08; bar.position.y = .04;
    const holder = grp(bar); holder.position.x = -3.25 + k * 1.3; g.add(holder);
    holder.add(at(sign(names[i], 1.1, .42, { bg: '#FBF3E2', fg: '#3A2E28', bd: col }), 0, .3, .5));
    bars.push({ bar, h: big[i] ? 2.2 : 1.1, big: big[i], name: names[i], holder });
  }
  return { g, bars };
}

function cake(candles = 6) {

  const flames = [];

function rainOn(A, x, z, w = 3, d = 2, n = 40, top = 4) {

const VOLS = {
  1: { data: DATA1, lessons: LESSONS1, scripts: SCRIPTS1, sents: SENTS1 },
  2: { data: DATA2, lessons: LESSONS2, scripts: SCRIPTS2, sents: SENTS2 },
  3: { data: DATA3, lessons: LESSONS3, scripts: SCRIPTS3, sents: SENTS3 },
  4: { data: DATA4, lessons: LESSONS4, scripts: SCRIPTS4, sents: SENTS4 },
  5: { data: DATA5, lessons: LESSONS5, scripts: SCRIPTS5, sents: SENTS5 }
};
const VOL_LIST = [1, 2, 3, 4, 5];            // shown in the pickers; the ones without data say 制作中
let VOL = 5;
const badgeKey = v => v === 5 ? 'zw5.badges' : 'zw.v' + v + '.badges';
function setVolume(v) {
  const V = VOLS[v]; if (!V) return false;
  VOL = v; store.set('zw.vol', v);
  DATA = V.data; LESSONS = V.lessons; SCRIPTS = V.scripts; SENTS = V.sents;
  CHAR_PY = null; HOMO = null;
  Object.keys(SCRIPT_CACHE).forEach(k => delete SCRIPT_CACHE[k]); Object.keys(NEW_SETS).forEach(k => delete NEW_SETS[k]);
  badges = store.get(badgeKey(v), {});
  books.forEach(b => { scene.remove(b); b.material.forEach(m => { if (m && m.map && m.map !== edgeTex) m.map.dispose(); }); });
  books.length = 0;
  DATA.forEach((d, i) => makeBook(d.n, i));
  renderChips();
  const name = '第' + CN_NUM[v] + '册'; drawBoard(v);
  $('volName').textContent = name; document.title = '《中文》' + name + ' 立体绘本';
  return true;
}
function volButtons(box, onPick) {
  box.innerHTML = VOL_LIST.map(v => VOLS[v]
    ? `<button class="btn${v === VOL ? ' main' : ''} vbtn" data-v="${v}">第${CN_NUM[v]}册</button>`
    : `<button class="btn vbtn" data-v="${v}" disabled title="制作中">第${CN_NUM[v]}册<small>制作中</small></button>`).join('');
  box.querySelectorAll('.vbtn:not([disabled])').forEach(b => b.onclick = () => onPick(+b.dataset.v));
}

/* 连词成句: a sentence from the lesson cut into chunks; tap them in the right order */
function gOrder(box, run) {

    return h;
  };
  const show = () => {
    if (run !== gameRun) return;
    const [a, lens] = sents[i]; const chunks = []; let p = a;
    lens.forEach((len, k) => { chunks.push({ k, a: p, len, t: d.text.slice(p, p + len) }); p += len; });
    const sentence = d.text.slice(a, p);

    let ans = [];

      `<div class="oans${notation === 'off' ? ' nopy' : ''}${notation === 'zhuyin' ? ' zy' : ''}" id="oAns"></div>` +

      '<div class="orow" id="oRow"><button class="btn" id="oHear">🔊 听一听</button><button class="btn" id="oReset">重来</button></div>' +

        score++; ansBox.classList.add('right'); Sound.play('chime'); $('gMsg').textContent = '排对了！';
        const readIt = () => Voice.play(readParts(sentence, ansBox), { gap: modeGap(), done: () => clearHl(ansBox) });

        $('oNext').onclick = () => {
          Sound.play('click'); Voice.cancel();
          i++; if (i < sents.length) show(); else gameWin(box, `${sents.length} 句排对 ${score} 句`, 'order');
        };

    };

      }, 1300);

      g3Msg('这里藏的是“' + cd.userData.ch + '”，再找找');
      setTimeout(() => { if (!g3Alive(run)) return; cd.remove(sp); cd.add(cd.userData.q); busy = false; }, 1500);

  };

/* =====================================================================
   Quiz and badge
   ===================================================================== */
let quiz = null;
/* quiz: the lesson's own questions + pinyin, listening, fill-in-the-blank and meaning questions
   generated from the lesson's new characters and words */
function buildQuiz(n) {
  const d = byN(n), chars = d.chars, words = (d.words || []).filter(w => w[0].length >= 2);
  const qs = LESSONS[n].quiz.map(q => ({ q: q.q, a: q.a, opts: shuffle([q.a].concat(q.w)) }));
  const uniq = a => [...new Set(a)];
  const wrong = (t, key, not = '') => uniq(shuffle(chars.filter(c => c[0] !== t[0] && c[key] !== t[key] && !not.includes(c[0]))).map(c => c[key])).slice(0, 2);
  const pool = shuffle(chars.slice());
  // 1) pinyin of a character (x2)
  pool.slice(0, 2).forEach(t => qs.push({ q: `“${t[0]}”的拼音是哪一个？`, a: t[1], opts: shuffle([t[1], ...wrong(t, 1)]), py: true, sayText: t[0] }));
  // 2) listen and pick the character (x2) - always read out, even with auto voice off
  pool.slice(2, 4).forEach(t => qs.push({ q: '听一听，是哪个字？', a: t[0], opts: shuffle([t[0], ...wrong(t, 0)]), big: true, listen: true, sayText: t[0] }));
  // 3) fill the missing character of a word (x2)
  const inChars = c => chars.find(x => x[0] === c);
  shuffle(words.filter(w => [...w[0]].some(inChars))).slice(0, 2).forEach(w => {
    const i = [...w[0]].findIndex(inChars), t = inChars(w[0][i]);
    const blank = w[0].slice(0, i) + '＿' + w[0].slice(i + 1);
    qs.push({ q: `“${blank}”（${w[1]}），空格里填哪个字？`, a: t[0], opts: shuffle([t[0], ...wrong(t, 0, w[0])]), big: true, sayText: '空格里填哪个字？' });   // distractors never come from the word itself
  });
  // 4) which word has this meaning (x1)
  if (words.length >= 3) {
    const t = pick(words), others = shuffle(words.filter(w => w[0] !== t[0] && w[2] !== t[2])).slice(0, 2).map(w => w[0]);
    qs.push({ q: `哪个词语的意思是“${t[2]}”？`, a: t[0], opts: shuffle([t[0], ...others]), sayText: '哪个词语是这个意思？' });
  }
  // lessons without a word list (e.g. the poems): top up with more listening questions
  pool.slice(4, 4 + Math.max(0, 9 - qs.length)).forEach(t => qs.push({ q: '听一听，是哪个字？', a: t[0], opts: shuffle([t[0], ...wrong(t, 0)]), big: true, listen: true, sayText: t[0] }));
  return qs.filter(q => q.opts.length >= 2);
}
function startQuiz() {
  clearHint(); clearBubbles(); Voice.cancel();
  setState(ST.QUIZ);
  quiz = { qs: buildQuiz(APP.n), i: 0 };
  $('quizVeil').classList.remove('hidden'); syncOverlay();
  gsap.fromTo('#quizBox', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .45, ease: 'back.out(1.6)' });
  renderQ();
}
function renderQ() {
  const q = quiz.qs[quiz.i];
  $('quizNum').textContent = `小测验　第 ${quiz.i + 1} 题，共 ${quiz.qs.length} 题`;
  $('quizQ').textContent = q.q; $('quizMsg').textContent = '';
  const box = $('quizOpts'); box.innerHTML = '';
  q.opts.forEach(o => {
    const b = document.createElement('button'); b.className = 'opt' + (q.py ? ' py' : '') + (q.big ? ' big' : ''); b.textContent = o;
    b.onclick = () => answer(b, o);
    box.appendChild(b);
  });
  if ($('autoSay').checked || q.listen) sayQuestion();
}
function sayQuestion() { const q = quiz.qs[quiz.i]; Voice.speak(q.sayText || (q.q + '　' + q.opts.join('，'))); }
async function answer(btn, o) {
  const q = quiz.qs[quiz.i];
  if (quiz.lock || btn.classList.contains('wrong')) return;
  if (o === q.a) {
    quiz.lock = true; btn.classList.add('right'); Sound.play('chime'); $('quizMsg').textContent = pick(['答对了！', '真棒！', '太好了！']);
    await wait(1000); quiz.lock = false;
    quiz.i++;

  } else {
    btn.classList.add('wrong', 'shake'); Sound.play('wrong'); $('quizMsg').textContent = '再想想看！';
    setTimeout(() => btn.classList.remove('shake'), 400);
  }
}

  else if (d === 'games') openGames(n);
  else openReader(n, d);
  syncOverlay();
}
document.querySelectorAll('.docTabs button').forEach(b => b.onclick = () => { Sound.play('click'); goTab(b.dataset.d); });
/* switching the read mode starts reading right away in the new mode */
document.querySelectorAll('.modeSeg button').forEach(b => b.onclick = () => {
  Sound.init(); Sound.play('click'); setReadMode(b.dataset.m);
  if (!$('readVeil').classList.contains('hidden')) {
    // reader: carry on from the current sentence, keeping "read all" or "follow" as it was
    const follow = !!(readActive && readActive.follow), k = readLastK;
    readStop();
    const units = readUnits(), start = units.findIndex(u => u.k >= k);
    readFrom(Math.max(0, start), follow);
  } else if (APP.act && APP.state === ST.SCENE_INTERACTION) {
    // something is being read (narration or a dialogue line): switch on the spot and keep going
    if (Voice.restart()) return;
    if (!(APP.busy && $('autoSay').checked))
      Voice.play(narrParts(APP.act), { gap: modeGap(), done: narrDone(APP.act) });
  }
});
setReadMode(readMode);
document.querySelectorAll('.spdIn').forEach(i => {
  i.addEventListener('change', () => { setRate(parseFloat(i.value), true); toast('语速：' + (+Voice.rate).toFixed(2) + '×'); });
  i.addEventListener('keydown', e => { if (e.key === 'Enter') i.blur(); });
});
document.querySelectorAll('.spdDn,.spdUp').forEach(b => b.onclick = () => {
  Sound.play('click');
  setRate(+Voice.rate + (b.classList.contains('spdUp') ? .05 : -.05), true);
  toast('语速：' + (+Voice.rate).toFixed(2) + '×');
});
/* a speed change takes effect right away: re-read the current piece at the new speed */
function applySpeedNow() {
  if (!$('readVeil').classList.contains('hidden')) {
    if (readActive) { const follow = readActive.follow, i = readCurIdx; readStop(); readFrom(i, follow); }
  } else Voice.restart(true);
}
syncSpeed();
$('autoSay').checked = store.get('zw5.autoSay', true);
$('autoSay').onchange = e => store.set('zw5.autoSay', e.target.checked);
$('musicBtn').onclick = () => { Sound.init(); Sound.setMusic(!Sound.on); drawMusicBtn(); toast(Sound.on ? '背景音乐：开' : '背景音乐：关（音效照常）'); };
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.remove('hidden'); gsap.fromTo(e, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .25 }); clearTimeout(toast.t); toast.t = setTimeout(() => gsap.to(e, { opacity: 0, duration: .3, onComplete: () => e.classList.add('hidden') }), 1800); }
$('homeBtn').onclick = () => {
  if (APP.busy) return;
  ['readVeil', 'cardVeil', 'quizVeil', 'endVeil', 'startVeil', 'gameVeil'].forEach(id => $(id).classList.add('hidden')); readStop(); syncOverlay();
  if (APP.state === ST.SCENE_INTERACTION || APP.state === ST.QUIZ || APP.state === ST.ENDING) closeBook();
};
$('readBtn').onclick = () => openReader(APP.n);
$('cardsBtn').onclick = () => openCards(APP.n);
$('orbitBtn').onclick = () => { if (APP.state === ST.SCENE_INTERACTION) setOrbit(!orbitOn); };
$('readClose').onclick = closeReader;
$('cardClose').onclick = closeCards;
$('playAll').onclick = () => { readStop(); readFrom(0, false); };
$('followBtn').onclick = () => { readStop(); readFrom(0, true); };
$('stopBtn').onclick = readStop;
$('notSeg').querySelectorAll('button').forEach(b => b.onclick = () => { notation = b.dataset.v; store.set('zw5.notation', notation); readStop(); renderReader(); renderNarr(); });
$('rate').oninput = e => setRate(+e.target.value, false);
$('rate').onchange = () => applySpeedNow();   // on release, so dragging doesn't restart over and over
$('fsDown').onclick = () => { readFs = Math.max(18, readFs - 3); store.set('zw5.fs', readFs); $('readBody').style.setProperty('--fs', readFs + 'px'); };
$('fsUp').onclick = () => { readFs = Math.min(44, readFs + 3); store.set('zw5.fs', readFs); $('readBody').style.setProperty('--fs', readFs + 'px'); };
$('quizSay').onclick = sayQuestion;
$('endRead').onclick = () => openReader(APP.n);
$('endCards').onclick = () => openCards(APP.n);
$('endAgain').onclick = readAgain;
$('endHome').onclick = () => { $('endVeil').classList.add('hidden'); syncOverlay(); closeBook(); };
$('cardView').querySelectorAll('button').forEach(b => b.onclick = () => { cardView = b.dataset.v; store.set('zw5.cardView', cardView); Voice.cancel(); Sound.play('click'); renderCards(); });
$('flipFront').querySelectorAll('button').forEach(b => b.onclick = () => { flipFront = b.dataset.v; store.set('zw5.flipFront', flipFront); Sound.play('click'); renderCards(); });
$('flipLayout').querySelectorAll('button').forEach(b => b.onclick = () => { flipLayout = b.dataset.v; store.set('zw5.flipLayout', flipLayout); Sound.play('click'); renderCards(); });
// arrow keys move through the cards in "one at a time" mode
window.addEventListener('keydown', e => {
  if ($('cardVeil').classList.contains('hidden') || cardView !== 'flip' || flipLayout !== 'one') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const d = byN(cardN)[cardTab]; flipGo(e.key === 'ArrowRight' ? 1 : -1, d); }
  else if (e.key === ' ' || e.key === 'Enter') { const c = document.querySelector('#cardGrid .fcard'); if (c) { e.preventDefault(); c.click(); } }
});
$('flipReset').onclick = () => { document.querySelectorAll('#cardGrid .fcard.on').forEach(c => c.classList.remove('on')); Sound.play('page'); syncFlipReset(); };
['readVeil', 'cardVeil'].forEach(id => $(id).addEventListener('click', e => { if (e.target.id === id) (id === 'readVeil' ? closeReader : closeCards)(); }));
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('readVeil').classList.contains('hidden')) closeReader(); else if (!$('cardVeil').classList.contains('hidden')) closeCards(); else if (!$('gameVeil').classList.contains('hidden')) closeGames(); }
  if (e.key === 'ArrowRight' && !APP.overlay) nextPage();
});

/* =====================================================================
   Boot
   ===================================================================== */
async function boot() {
  try { await Promise.race([document.fonts.load(`700 40px "LXGW WenKai"`), wait(2500)]); } catch (e) { }
  buildCampus(); makePupil();
  setVolume(VOLS[store.get('zw.vol', 5)] ? store.get('zw.vol', 5) : 5);
  // behind the start screen: the school gate (not the classroom), exactly where the story begins
  CAMPUS.visible = true; room.visible = false; books.forEach(b => b.visible = false);
  scene.fog.near = 220; scene.fog.far = 600; camera.far = 800; camera.updateProjectionMatrix();
  setLight(CAMPUS_LIGHT, 0);
  for (let v = 1; v <= 5; v++) BLD[v].scale.setScalar(.01);
  KIDC.position.set(4.2, 0, 40); KIDC.rotation.y = -.3;      // beside the path, so the school's name is readable
  camTo(cw(0, 4, 66), cw(0, 13, 26), 0);        // gate in the lower half, the title above it
  drawMusicBtn();
  frame();
  // intro: pick a volume, then the study opens on that volume's shelf
  $('startBtn').onclick = () => {
    Sound.init();
    try { if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } } catch (e) { }
    gsap.to('#intro', { opacity: 0, duration: .6, onComplete: () => $('intro').classList.add('hidden') });
    goCampus(true);
  };
  // on the shelf: 换一册
  $('volBtn').onclick = () => backToCampus();
  $('volBtnOld') && ($('volBtnOld').onclick = () => {
    if (APP.state !== ST.BOOKSHELF || APP.busy) return;
    Sound.play('click');
    volButtons($('volBtns'), v => {
      $('volVeil').classList.add('hidden'); syncOverlay();
      if (v === VOL) return;
      Sound.play('page'); setVolume(v);
      books.forEach((b, i) => { const s = b.scale.clone(); b.scale.multiplyScalar(.01); gsap.to(b.scale, { x: s.x, y: s.y, z: s.z, duration: .5, delay: i * .04, ease: 'back.out(1.6)' }); });
    });
    $('volVeil').classList.remove('hidden'); syncOverlay();
  });
  $('volVeil').addEventListener('click', e => { if (e.target.id === 'volVeil') { $('volVeil').classList.add('hidden'); syncOverlay(); } });
}
window.PB = { APP, openBook, nextPage, closeBook, startQuiz, runHot, openReader, openCards, finishQuiz };
boot();

</script>
</body>
</html>
